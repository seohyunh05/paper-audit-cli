[project]
name = "paper-audit"
version = "1.0.0"
description = "CLI to audit PDFs in Google Drive using an economics-theory reviewer prompt; keeps/deletes per-paper threads."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "tqdm>=4.66.4",
  "pydantic>=2.7.4",
  "google-api-python-client>=2.137.0",
  "google-auth>=2.32.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "pypdf>=4.2.0",
  "openai>=1.0.0"
]

[project.scripts]
paper-audit = "paper_audit.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
